<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Scroll Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<style>
  body {
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  background: #111;
}

.slider-container {
  width: 100%;
  overflow: hidden;
  padding: 20px 0;
}

.slider-track {
  display: flex;
  width: fit-content;
  animation: scroll 30s linear infinite;
}

.slide {
  min-width: 250px;
  height: 250px;
  background: #444;
  color: #fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 10px;
  border-radius: 10px;
  flex-shrink: 0;
}

/* Smooth scroll animation */
@keyframes scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}

/* Responsive (optional) */
@media (max-width: 768px) {
  .slide {
    min-width: 180px;
    height: 180px;
    font-size: 16px;
  }
}

</style>
<body>
  <div class="slider-container">
    <div class="slider-track" id="sliderTrack">
      <!-- 15 product slides -->
      <div class="slide">Slide 1</div>
      <div class="slide">Slide 2</div>
      <div class="slide">Slide 3</div>
      <div class="slide">Slide 4</div>
      <div class="slide">Slide 5</div>
      <div class="slide">Slide 6</div>
      <div class="slide">Slide 7</div>
      <div class="slide">Slide 8</div>
      <div class="slide">Slide 9</div>
      <div class="slide">Slide 10</div>
      <div class="slide">Slide 11</div>
      <div class="slide">Slide 12</div>
      <div class="slide">Slide 13</div>
      <div class="slide">Slide 14</div>
      <div class="slide">Slide 15</div>
    </div>
  </div>

  <script>
    

  </script>
</body>
</html>
